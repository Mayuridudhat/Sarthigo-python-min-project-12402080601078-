{% extends "rentals/base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="max-w-md mx-auto px-4 py-12">
  <form method="post" class="bg-white rounded-2xl shadow p-8 space-y-4">
    {% csrf_token %}
    <h1 class="text-2xl font-bold">Login</h1>
    {% if form.errors %}<p class="rounded bg-red-100 px-3 py-2 text-sm text-red-800">Wrong username or password.</p>{% endif %}
    <div><label class="block text-sm font-medium mb-1">Username</label>{{ form.username }}</div>
    <div><label class="block text-sm font-medium mb-1">Password</label>{{ form.password }}</div>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="w-full rounded-lg bg-amber-500 py-2.5 font-semibold text-slate-900 hover:bg-amber-400">Login</button>
    <p class="text-sm text-slate-500">New here? <a href="{% url 'register' %}" class="text-amber-600 font-semibold">Create an account</a></p>
  </form>
</div>
<style>
  #id_username, #id_password { width:100%; border:1px solid #cbd5e1; border-radius:.5rem; padding:.5rem .75rem; }
</style>
{% endblock %}

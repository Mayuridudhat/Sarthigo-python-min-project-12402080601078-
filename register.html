{% extends "rentals/base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<div class="max-w-md mx-auto px-4 py-12">
  <form method="post" class="bg-white rounded-2xl shadow p-8 space-y-4">
    {% csrf_token %}
    <h1 class="text-2xl font-bold">Create account</h1>
    {% for field in form %}
      <div>
        <label class="block text-sm font-medium mb-1">{{ field.label }}</label>
        {{ field }}
        {% for error in field.errors %}<p class="text-sm text-red-600 mt-1">{{ error }}</p>{% endfor %}
      </div>
    {% endfor %}
    <button class="w-full rounded-lg bg-amber-500 py-2.5 font-semibold text-slate-900 hover:bg-amber-400">Sign up</button>
    <p class="text-sm text-slate-500">Already registered? <a href="{% url 'login' %}" class="text-amber-600 font-semibold">Login</a></p>
  </form>
</div>
{% endblock %}
